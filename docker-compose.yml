version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: credit_rating_db
    environment:
      POSTGRES_USER: credit_rating_user
      POSTGRES_PASSWORD: credit_rating_pass
      POSTGRES_DB: credit_rating_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_rating_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
